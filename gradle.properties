org.gradle.jvmargs=-Xmx1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.configuration-cache=true
org.gradle.java.installations.auto-download=false
# Retry downloads that fail with HTTP 429 or 5xx (Maven Central limits the shared GitHub runner IPs). The default is
# 3 attempts with 125 ms backoff. 8 attempts with a 1 s start wait at most 1+2+...+64 = 127 s per file.
# systemProp.* reaches included builds such as build-logic, because they run in the same JVM.
systemProp.org.gradle.internal.repository.max.tentatives=8
systemProp.org.gradle.internal.repository.initial.backoff=1000
