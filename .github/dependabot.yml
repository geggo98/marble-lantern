version: 2
updates:
  # Keeps the pinned GitHub Actions current. Dependabot reads the `# vX.Y.Z` comments that pinact writes.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    # Wait 14 days after a release before proposing it (the same period as min-release-age in .npmrc, see docs/supply-chain.md):
    # a hijacked or broken release is usually pulled within days. The cooldown does not delay security updates.
    cooldown:
      default-days: 14
    commit-message:
      prefix: ci
    # One combined pull request per run instead of one per action.
    groups:
      github-actions:
        patterns:
          - "*"

  # npm dependencies of the offline UI (web/). Not Gradle: Dependabot cannot regenerate gradle/verification-metadata.xml.
  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: deps
      prefix-development: deps
    groups:
      npm-dependencies:
        patterns:
          - "*"

  # npm dependencies of the online app (app/, Hilla). Same rules as web/.
  - package-ecosystem: npm
    directory: "/app"
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: deps
      prefix-development: deps
    groups:
      npm-dependencies:
        patterns:
          - "*"
