<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Marble Lantern</title>
    <meta name="description" content="A board game engine in your browser, written in Java and C++." />
    <!-- Installable app (docs/web-ui.md, "Installable app and offline cache"). Vite prefixes these paths with the base path. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- --ml-color-bg of web/design/tokens.css; Chrome.tsx (applyTheme) overrides both when the theme switch forces a theme -->
    <meta name="theme-color" content="#f5f0e6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14110e" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Marble Lantern" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
