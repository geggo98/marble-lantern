<g id="ml-piece-a"><circle class="ml-piece__shadow" cy="2" r="13.5"/><circle class="ml-piece__body--a" r="13.5"/><ellipse class="ml-piece__shine" cx="-4.8" cy="-6.4" rx="3.6" ry="2.1" transform="rotate(-32 -4.8 -6.4)"/></g>
<g id="ml-piece-b"><circle class="ml-piece__shadow" cy="2" r="13.5"/><circle class="ml-piece__body--b" r="13.5"/><circle class="ml-piece__mark" r="6.2"/><ellipse class="ml-piece__shine" cx="-4.8" cy="-6.4" rx="3.6" ry="2.1" transform="rotate(-32 -4.8 -6.4)"/></g>
</defs>

