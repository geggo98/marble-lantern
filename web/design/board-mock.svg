<svg class="ml-board__svg" width="468" height="532" viewBox="-234 -266 468 532" role="group" aria-label="marble-lantern board mock: side A (plain) to move, one piece selected" xmlns="http://www.w3.org/2000/svg">
<title>marble-lantern board mock</title>
<style>
svg{--ml-color-focus:#5b2bd9;--ml-color-danger:#a3261b;--ml-board-star:#e7dcc6;--ml-board-star-edge:#b9aa8b;--ml-board-glow:#f3ead8;--ml-board-socket:#cfc0a2;--ml-board-socket-edge:#84765c;--ml-board-select:#1f1b16;--ml-board-target:#1f1b16;--ml-piece-a:#e39a0b;--ml-piece-a-hi:#ffd476;--ml-piece-a-lo:#b46f00;--ml-piece-a-edge:#6b4100;--ml-piece-a-text:#7a4a00;--ml-piece-b:#1565ad;--ml-piece-b-hi:#5fa8e6;--ml-piece-b-lo:#0a4379;--ml-piece-b-edge:#062c52;--ml-piece-b-mark:#fff6e0;--ml-piece-b-text:#0f538f;}
@media (prefers-color-scheme: dark){svg{--ml-color-focus:#c2adff;--ml-color-danger:#ff9d90;--ml-board-star:#25201b;--ml-board-star-edge:#4a4135;--ml-board-glow:#3a2f20;--ml-board-socket:#120f0c;--ml-board-socket-edge:#7a6d5a;--ml-board-select:#f2ebdf;--ml-board-target:#f2ebdf;--ml-piece-a:#f0aa1f;--ml-piece-a-hi:#ffe19a;--ml-piece-a-lo:#b87400;--ml-piece-a-edge:#ffd88a;--ml-piece-a-text:#f3b744;--ml-piece-b:#2f7fcc;--ml-piece-b-hi:#8cc4f5;--ml-piece-b-lo:#114a85;--ml-piece-b-edge:#a9d4f8;--ml-piece-b-mark:#fff6e0;--ml-piece-b-text:#7fbaf0;}}
/* ===== board ===== */
.ml-board { margin-inline: calc(var(--ml-gutter) * -0.5); }
.ml-board__svg { display: block; width: 100%; height: auto; touch-action: manipulation; }

.ml-board__svg.is-inert { cursor: progress; }
.ml-board__plate-edge { fill: var(--ml-board-star-edge); stroke: var(--ml-board-star-edge); stroke-width: 51; stroke-linejoin: round; }
.ml-board__plate-fill { fill: url(#ml-plate); stroke: url(#ml-plate); stroke-width: 48; stroke-linejoin: round; }
.ml-stop-glow { stop-color: var(--ml-board-glow); }
.ml-stop-star { stop-color: var(--ml-board-star); }
.ml-socket { fill: var(--ml-board-socket); stroke: var(--ml-board-socket-edge); stroke-width: 1; }
.ml-socket--goal-a { stroke: var(--ml-piece-a-text); stroke-width: 2.5; }
.ml-socket--goal-b { stroke: var(--ml-piece-b-text); stroke-width: 2.5; }
.ml-socket__mark-b { fill: none; stroke: var(--ml-piece-b-text); stroke-width: 1.6; }

/* pieces: side A plain, side B carries a ring */
.ml-piece__shadow { fill: #000; opacity: 0.22; }
.ml-piece__body--a { fill: url(#ml-grad-a); stroke: var(--ml-piece-a-edge); stroke-width: 1.5; }
.ml-piece__body--b { fill: url(#ml-grad-b); stroke: var(--ml-piece-b-edge); stroke-width: 1.5; }
.ml-piece__mark { fill: none; stroke: var(--ml-piece-b-mark); stroke-width: 2.8; }
.ml-piece__shine { fill: #fff; opacity: 0.5; }
.ml-stop-a-hi { stop-color: var(--ml-piece-a-hi); } .ml-stop-a { stop-color: var(--ml-piece-a); } .ml-stop-a-lo { stop-color: var(--ml-piece-a-lo); }
.ml-stop-b-hi { stop-color: var(--ml-piece-b-hi); } .ml-stop-b { stop-color: var(--ml-piece-b); } .ml-stop-b-lo { stop-color: var(--ml-piece-b-lo); }

/* selection, targets, preview */
.ml-select { fill: none; stroke: var(--ml-board-select); stroke-width: 3; }
.ml-target__ring { fill: none; stroke: var(--ml-board-target); stroke-width: 2.2; }
.ml-target__dot { fill: var(--ml-board-target); }
.ml-preview__line { fill: none; stroke: var(--ml-board-select); stroke-width: 2.5; stroke-dasharray: 2 6; stroke-linecap: round; stroke-linejoin: round; }
.ml-preview__ghost { opacity: 0.55; }

/* last move trail */
.ml-trail__line { fill: none; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; opacity: 0.6; }
.ml-trail__origin { fill: none; stroke-width: 2.5; stroke-dasharray: 3 3.5; }
.ml-trail__dest { fill: none; stroke-width: 2.5; }
.ml-trail--a .ml-trail__line, .ml-trail--a .ml-trail__origin, .ml-trail--a .ml-trail__dest { stroke: var(--ml-piece-a-text); }
.ml-trail--b .ml-trail__line, .ml-trail--b .ml-trail__origin, .ml-trail--b .ml-trail__dest { stroke: var(--ml-piece-b-text); }
.ml-trail--a .ml-trail__hop { fill: var(--ml-piece-a-text); }
.ml-trail--b .ml-trail__hop { fill: var(--ml-piece-b-text); }

/* keyboard focus on a cell, illegal click, result halo */
.ml-cellfocus { fill: none; stroke: var(--ml-color-focus); stroke-width: 3.5; }
.ml-cellfocus__gap { fill: none; stroke: var(--ml-board-star); stroke-width: 2; }
.ml-illegal circle { fill: none; stroke: var(--ml-color-danger); stroke-width: 2.5; }
.ml-illegal path { fill: none; stroke: var(--ml-color-danger); stroke-width: 2.5; stroke-linecap: round; }
.ml-illegal { transform-box: fill-box; transform-origin: center; animation: ml-nudge 240ms var(--ml-ease) 1; }
@keyframes ml-nudge { 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }
.ml-halo { fill: none; stroke: var(--ml-board-select); stroke-width: 2; stroke-dasharray: 1 5; stroke-linecap: round; }
@media (prefers-reduced-motion: reduce) { .ml-illegal { animation: none; } }

</style>
